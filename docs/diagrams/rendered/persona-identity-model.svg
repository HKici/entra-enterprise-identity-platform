<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Persona- und Identity-Modell der Nordstern Handelsgruppe</title>
  <desc id="desc">Workforce- und externe Identitäten nutzen Entra. Privilegierte und Emergency-Access-Administratoren haben getrennte cloud-only Identitäten.</desc>
  <defs><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker><marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker></defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Persona- und Identity-Modell – Identitätskontext und administrative Trennung</text>
  <rect x="55" y="110" width="425" height="75" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="267" y="140" font-size="16" font-weight="700">Workforce-Identitäten</text><text x="267" y="164" font-size="13">Interne Beschäftigte; Beschäftigungs-, Organisations- und Standortattribute aus HR</text></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><rect x="55" y="215" width="190" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="150" y="244" font-size="15" font-weight="700">Office User</text><text x="150" y="267" font-size="13">Zentrale Hamburg</text><rect x="275" y="215" width="205" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="377" y="244" font-size="15" font-weight="700">Warehouse User</text><text x="377" y="267" font-size="13">Lager Nord</text><rect x="55" y="310" width="190" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="150" y="339" font-size="15" font-weight="700">Warehouse User</text><text x="150" y="362" font-size="13">Lager Süd</text><rect x="275" y="310" width="205" height="70" rx="9" fill="#fff" stroke="#64748b"/><text x="377" y="339" font-size="15" font-weight="700">Store User</text><text x="377" y="362" font-size="13">Filialen</text></g>
  <path d="M480 148 H620" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#blueArrow)"/><text x="550" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Workforce-Zugriff</text>
  <rect x="620" y="245" width="400" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="820" y="280" font-size="17" font-weight="700">Microsoft Entra ID</text><text x="820" y="306" font-size="14">Cloud-Identity- und Access-Control-Plane</text><text x="820" y="330" font-size="13">Cloud-Zugriffsattribute, Gruppen, Rollen und AUs</text></g>
  <path d="M480 125 H535 V90 H570 V490 H620" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/><text x="590" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">fachliche Koppelung; keine Berechtigungszuweisung</text>
  <rect x="55" y="465" width="425" height="95" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="267" y="495" font-size="16" font-weight="700">External Contractor</text><text x="267" y="521" font-size="13">Zeitlich und auftragsbezogen</text><text x="267" y="544" font-size="13">Technisches externes Zugriffsobjekt in Entra</text></g><path d="M480 512 H560 V355 H620" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/><text x="535" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">externer, begrenzter Zugriff</text>
  <rect x="620" y="440" width="400" height="100" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="820" y="470" font-size="16" font-weight="700">Privileged Administrator</text><text x="820" y="496" font-size="13">Separate cloud-only administrative Identität</text><text x="820" y="519" font-size="13">An aktive oder genehmigte Workforce-Funktion gekoppelt</text></g><path d="M820 440 V355" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow)"/><text x="930" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">separierte administrative Identität</text>
  <rect x="620" y="580" width="400" height="90" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="820" y="610" font-size="16" font-weight="700">Emergency Access Administrator</text><text x="820" y="636" font-size="13">Cloud-only Notfallidentität</text><text x="820" y="658" font-size="13">Details des Emergency-Access-Designs: CA-003</text></g><path d="M860 580 V355" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#goldArrow)"/><text x="890" y="565" font-family="Arial, sans-serif" font-size="12" fill="#92400e">Notfallzugriff</text>
</svg>
