<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc">
  <title id="title">Hybrid-Identity-Zielarchitektur der Nordstern Handelsgruppe</title>
  <desc id="desc">HR führt fachliche Attribute. Active Directory hält technische On-Premises-Attribute. Ein noch auszuwählender Synchronisationspfad überträgt gezielt hybride Workforce-Objekte nach Entra. Externe, privilegierte und Emergency-Access-Identitäten bleiben cloud-only.</desc>
  <defs><marker id="grayArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="redArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker><marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker></defs>
  <rect width="1500" height="760" fill="#fff"/>
  <text x="50" y="62" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Hybrid-Identity-Zielarchitektur – gezielter Hybrid-Scope, getrennte cloud-only Identitäten</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="50" y="160" width="250" height="90" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="175" y="190" font-size="16" font-weight="700">HR-System</text><text x="175" y="216" font-size="13">Fachliche Quelle für Beschäftigung, Organisation</text><text x="175" y="237" font-size="13">und soweit vorhanden Standort</text>
    <rect x="370" y="160" width="300" height="90" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/><text x="520" y="190" font-size="16" font-weight="700">On-Premises Active Directory</text><text x="520" y="216" font-size="13">Technisch notwendige On-Premises-Kontoattribute</text><text x="520" y="237" font-size="13">für Workforce mit Hybridabhängigkeit</text>
    <rect x="740" y="145" width="320" height="120" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="900" y="175" font-size="16" font-weight="700">Synchronisationspfad</text><text x="900" y="201" font-size="13">Microsoft Entra Connect Sync oder</text><text x="900" y="223" font-size="13">Microsoft Entra Cloud Sync</text><text x="900" y="247" font-size="12" fill="#9a3412">Auswahl offen; pro Objekt nur ein aktiver Export</text>
    <rect x="1110" y="155" width="300" height="100" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="1260" y="187" font-size="17" font-weight="700">Microsoft Entra ID</text><text x="1260" y="213" font-size="14">Cloud-Identity- und Access-Control-Plane</text><text x="1260" y="237" font-size="13">Cloud-Zugriffsattribute, Gruppen, Rollen und AUs</text>
  </g>
  <path d="M300 205 H370" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5"/><text x="335" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">fachliche Datenquelle; Provisionierungsweg offen</text>
  <path d="M670 205 H740" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#grayArrow)"/><text x="705" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">hybrid relevante AD-Attribute</text>
  <path d="M1060 205 H1110" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#orangeArrow)"/><text x="1085" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a3412">kontrollierter Export</text>
  <rect x="370" y="335" width="690" height="90" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a"><text x="715" y="365" font-size="16" font-weight="700">Hybrid-Scope</text><text x="715" y="391" font-size="13">Nur interne Workforce-Objekte mit bestätigter On-Premises-Abhängigkeit</text><text x="715" y="413" font-size="13">Stabile Korrelation; Scope- und Duplicate-Prüfung</text></g><path d="M715 335 V285 H900 V265" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#blueArrow)"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#0f172a">
    <rect x="50" y="510" width="250" height="95" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="175" y="540" font-size="16" font-weight="700">Vertrags-/Sponsorquelle</text><text x="175" y="566" font-size="13">Noch nicht konkret benannt</text><text x="175" y="588" font-size="13">Auftrag, Sponsor und Laufzeit</text>
    <rect x="370" y="510" width="260" height="95" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/><text x="500" y="540" font-size="16" font-weight="700">External Contractor</text><text x="500" y="570" font-size="13">Cloud-only technisches externes Zugriffsobjekt</text>
    <rect x="700" y="510" width="310" height="95" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="855" y="540" font-size="16" font-weight="700">Privileged Administrator</text><text x="855" y="566" font-size="13">Separate cloud-only administrative Identität</text><text x="855" y="588" font-size="13">an Workforce-Funktion gekoppelt</text>
    <rect x="1080" y="510" width="330" height="95" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/><text x="1245" y="540" font-size="16" font-weight="700">Emergency Access Administrator</text><text x="1245" y="566" font-size="13">Cloud-only Notfallidentität</text><text x="1245" y="588" font-size="13">Details des Schutzmodells: CA-003</text>
  </g>
  <path d="M300 557 H370" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/><path d="M630 557 H1080 V255" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#orangeArrow)"/>
  <path d="M855 510 V395 H1190 V255" fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow)"/><path d="M1245 510 V255" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#goldArrow)"/>
</svg>
